name: Release

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ vars.IMAGE_NAME }}:latest

      - name: Deploy via Portainer API
        env:
          PORTAINER_URL: ${{ vars.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
          ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
        run: |
          STACK_FILE=$(curl -sf "$PORTAINER_URL/api/stacks/$STACK_ID/file" \
            -H "X-API-Key: $PORTAINER_API_KEY" | jq -r '.StackFileContent')
          # Portainer's PUT can return HTTP 200 with the redeploy itself still failed
          # internally (body's top-level "Status" is 3 = error, not 1 = active) — its
          # own compose-plugin deployment goroutine has been observed to report Status:3
          # immediately and then settle to Status:1 a few seconds later on its own, with
          # no further action needed. Firing a second PUT while that's still in flight
          # gets a 409 "Stack deployment is already in progress" rather than helping, so
          # don't retry the PUT — poll the stack's own GET status instead and only fail
          # if it never settles.
          curl -sf -X PUT "$PORTAINER_URL/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" \
            -H "X-API-Key: $PORTAINER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"stackFileContent\": $(echo "$STACK_FILE" | jq -Rs .), \"pullImage\": true}" \
            > /tmp/portainer_deploy_resp.json
          cat /tmp/portainer_deploy_resp.json

          for attempt in 1 2 3 4 5 6; do
            STATUS=$(curl -sf "$PORTAINER_URL/api/stacks/$STACK_ID" \
              -H "X-API-Key: $PORTAINER_API_KEY" | jq -r '.Status')
            if [[ "$STATUS" == "1" ]]; then
              echo "Deploy settled to Status: $STATUS"
              exit 0
            fi
            echo "Attempt $attempt: stack Status=$STATUS (expected 1/active), waiting 5s..."
            sleep 5
          done
          echo "Deploy did not settle to Status 1 after 30s"
          exit 1

      - name: Purge unused remote images
        env:
          PORTAINER_URL: ${{ vars.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
        run: |
          curl -sf -X POST \
            "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/images/prune?filters=%7B%22dangling%22%3A%7B%22false%22%3Atrue%7D%7D" \
            -H "X-API-Key: $PORTAINER_API_KEY"
