name: SBOM Generation and Upload

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Install CycloneDX
        run: npm install -g @cyclonedx/cyclonedx-npm@6.0.1

      - name: Generate SBOM
        run: cyclonedx-npm --output-format JSON --output-file sbom.json

      - name: Add Node.js runtime to SBOM
        run: |
          NODE_VERSION=$(grep -m1 -oP '^ARG NODE_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile)
          if [ -z "$NODE_VERSION" ]; then
            echo "❌ No exact ARG NODE_VERSION=X.Y.Z in Dockerfile"
            exit 1
          fi
          jq --arg v "$NODE_VERSION" '.components += [{
            "type": "platform", "bom-ref": "runtime-node", "name": "node", "version": $v,
            "purl": "pkg:generic/node@\($v)",
            "cpe": "cpe:2.3:a:nodejs:node.js:\($v):*:*:*:*:*:*:*"
          }]' sbom.json > sbom.json.tmp && mv sbom.json.tmp sbom.json
          echo "✅ Added node@$NODE_VERSION to SBOM"

      - name: Archive SBOM as artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 365

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Upload SBOM to Dependency-Track
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --request POST "${{ vars.DEPTRACK_URL }}/api/v1/bom" \
            --header "X-Api-Key: ${{ secrets.DEPTRACK_API_KEY }}" \
            --form "projectName=registryview" \
            --form "projectVersion=latest" \
            --form "autoCreate=true" \
            --form "bom=@sbom.json")
          echo "HTTP response: $HTTP_CODE"
          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "❌ Upload failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ SBOM uploaded successfully"

      - name: Tag project with current version
        run: |
          PROJECT=$(curl -s "${{ vars.DEPTRACK_URL }}/api/v1/project?name=registryview&version=latest" \
            --header "X-Api-Key: ${{ secrets.DEPTRACK_API_KEY }}" | jq '.[0]')
          UPDATED=$(echo "$PROJECT" | jq --arg tag "${{ steps.version.outputs.version }}" '{uuid, name, version, classifier, active, tags: [{"name": $tag}]}')
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ vars.DEPTRACK_URL }}/api/v1/project" \
            --header "X-Api-Key: ${{ secrets.DEPTRACK_API_KEY }}" \
            --header "Content-Type: application/json" \
            --data "$UPDATED")
          echo "HTTP response: $HTTP_CODE"
          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "❌ Tag update failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Tagged as ${{ steps.version.outputs.version }}"
